[project]
name = "splity-api"
version = "0.1.0"
description = "Splity backend: FastAPI service for shared expenses and the AI finance assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "litellm>=1.110.3",
    "langgraph>=1.2.24",
    "mcp>=2.3.0",
    "langfuse>=5.2.0",
    "sqlglot>=30.34.0",
    "pgvector>=0.5.1",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "hypothesis>=6.120",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "db: integration tests that need a PostgreSQL database (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends() in default args is idiomatic

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # the local alembic/ migrations folder is not the package
