- {id: settle-en-1, category: write, lang: en, input: "Rahul paid me back, settle up with him", expect: {proposal: settle_up, args: {friend: Rahul}}}
- {id: settle-en-2, category: write, lang: en, input: "I paid Ram Singh 100 for the lunch", expect: {proposal: settle_up, args: {friend: Ram Singh, amount: 100}}}
- {id: settle-hg-1, category: write, lang: hinglish, input: "Amit ke saath hisaab clear kar do", expect: {proposal: settle_up, args: {friend: Amit}}}
- {id: group-en-1, category: write, lang: en, input: "Create a group called Manali Trip with Rahul and Ram Kumar", expect: {proposal: create_group, args: {name: Manali, members: [Rahul, Ram Kumar]}}}
