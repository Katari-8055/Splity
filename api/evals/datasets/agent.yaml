# ── document search (RAG) ──────────────────────────────────────────────────────
- {id: rag-en-1, category: rag, lang: en, input: "What did I order at Barbeque Nation?", expect: {tools_any: [search_documents], no_write: true, contains_any: ["Paneer", "Naan", "Beer"]}}
