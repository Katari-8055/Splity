- {id: split-en-2, category: write, lang: en, input: "I paid 1500 for groceries, split it with Amit", expect: {proposal: create_expense, args: {amount: 1500, participants: [Amit], category: Groceries}}}
- {id: split-en-3, category: write, lang: en, input: "Add 3000 for the Goa villa to the Goa Trip group", expect: {proposal: create_expense, args: {amount: 3000, group: Goa}}}
- {id: split-en-4, category: write, lang: en, input: "Rent is 20000, I pay 60% and Amit pays 40%", expect: {proposal: create_expense, args: {amount: 20000, split_type: percentage}}}
