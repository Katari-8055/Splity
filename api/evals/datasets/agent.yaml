- {id: msg-en-1, category: write, lang: en, input: "Post 'Pack sunscreen!' in the Goa Trip group", expect: {proposal: post_group_message, args: {group: Goa, message: sunscreen}}}
- {id: friend-en-1, category: write, lang: en, input: "Add kabir.rao@eval.splity as my friend", expect: {proposal: add_friend, args: {email: kabir.rao@eval.splity}}}
- {id: receipt-en-1, category: write, lang: en, input: "Split my Barbeque Nation receipt: I had the paneer and the beers, Rahul and Priya shared the naan and gulab jamun", expect: {proposal: split_receipt}}

