# Agent behaviour: tool routing, argument extraction, clarification, ambiguity.
# expect keys:
#   tools_any: at least one of these tools was called
#   tools_none: none of these tools was called
#   proposal: the change proposed for confirmation (tool name)
#   args: subset of the proposal's arguments (numbers equal; strings/lists match case-insensitively by containment)
#   clarify: true → no proposal, and the reply asks a question
#   no_write: true → no proposal
#   contains_any / not_contains: checks on the final reply

# ── balances ───────────────────────────────────────────────────────────────────
- {id: bal-en-1, category: balances, lang: en, input: "Who owes me money?", expect: {tools_any: [get_balances], no_write: true}}
- {id: bal-en-2, category: balances, lang: en, input: "Do I owe Ram Singh anything?", expect: {tools_any: [get_balances], no_write: true, contains_any: ["200"]}}
- {id: bal-hi-1, category: balances, lang: hi, input: "मुझे किसने पैसे देने हैं?", expect: {tools_any: [get_balances], no_write: true}}
- {id: bal-hg-1, category: balances, lang: hinglish, input: "Rahul ka kitna baaki hai mere upar?", expect: {tools_any: [get_balances], no_write: true}}
- {id: bal-hg-2, category: balances, lang: hinglish, input: "mera total hisaab batao, kisko dena hai kisse lena hai", expect: {tools_any: [get_balances], no_write: true}}

